<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Smart Recruitment</title>
    <link rel="stylesheet" href="../Styles/login.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Left Section - Login Form -->
        <div class="login-form-section">
            <div class="logo-section">
                <div class="logo">
                    <img src="../templates/logo-2.png" alt="Smart Recruitment Logo" class="logo-icon">
                </div>
            </div>

            <div class="form-content">
                <h2 class="signin-title">HR Login</h2>
                
                <div class="register-prompt">
                    <p>Log in to access the HR Dashboard</p>
                    <p>Users can view <a href="Home.html" class="register-link">Jobs here</a></p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <img src="../templates/mail.png" alt="Email" class="input-icon">
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <img src="../templates/password.png" alt="Password" class="input-icon">
                            <input type="password" id="password" placeholder="Enter your Password" required>
                            <i class="fas fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Rememeber me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">HR Login</button>

                    <div class="social-login">
                        <p class="or-text">or continue with</p>
                        <button type="button" class="google-btn">
                            <img src="../templates/logo_Google.png" alt="Google" class="google-icon">
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Section - Illustration -->
        <div class="illustration-section">
            <div class="illustration">
                <img src="../templates/picture.png" alt="Illustration" class="illustration-img">
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
        
        // Login form handler
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault();
        
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
        
            // Kiểm tra thông tin đăng nhập mẫu
                if (email === "admin@gmail.com" && password === "123456") {
                // Lưu thông tin đăng nhập vào localStorage
                localStorage.setItem('loggedInUser', email);
                console.log('Saved user to localStorage:', email); // Debug log
                alert("Login successful!");
                window.location.href = "../html/Home.html";
            } else if (email && password) {
                // Lưu thông tin đăng nhập vào localStorage cho bất kỳ email/password nào
                localStorage.setItem('loggedInUser', email);
                console.log('Saved user to localStorage:', email); // Debug log
                alert("Login successful!");
                window.location.href = "../html/Home.html";
            } else {
                alert("Please enter all required information!");
            }
        });

        </script>
        
</body>
</html>
