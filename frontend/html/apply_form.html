<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tải lên CV hoặc Ảnh</title>
    <link rel="stylesheet" href="/frontend/Styles/style.css" />
</head>
<body>
    <div class="container">
        <h1>Tải lên CV hoặc Ảnh</h1>

        <div class="api-config">
            <label for="apiUrl">API URL:</label>
            <input id="apiUrl" type="text" />
            <span class="hint">Mặc định là FastAPI local</span>
        </div>

        <form id="uploadForm">
            <div class="field">
                <label for="fileInput">Chọn file (PDF, PNG, JPG, DOCX):</label>
                <input 
                    id="fileInput" 
                    type="file" 
                    accept="application/pdf,.pdf,.png,.jpg,.jpeg,.docx" 
                    required 
                />
            </div>
            <button type="submit">Tải lên</button>
        </form>

        <div id="result" class="result" aria-live="polite"></div>
    </div>

    <script>
    (function () {
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const apiUrlInput = document.getElementById('apiUrl');
        const resultEl = document.getElementById('result');

        // Thiết lập URL mặc định
        try {
            const defaultOrigin = window.location.origin;
            if (defaultOrigin && defaultOrigin.startsWith('http')) {
                apiUrlInput.value = defaultOrigin;
            } else {
                apiUrlInput.value = 'http://127.0.0.1:8000';
            }
        } catch (_) {
            apiUrlInput.value = 'http://127.0.0.1:8000';
        }

        function setResult(message, type = 'info') {
            resultEl.className = `result ${type}`;
            resultEl.textContent = message;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                setResult('Vui lòng chọn một file.', 'error');
                return;
            }

            // Kiểm tra định dạng được phép
            const allowedExt = ['.pdf', '.png', '.jpg', '.jpeg', '.docx'];
            const fileName = file.name.toLowerCase();
            const isValid = allowedExt.some(ext => fileName.endsWith(ext));
            if (!isValid) {
                setResult('Định dạng file không hợp lệ. Chỉ chấp nhận: PDF, PNG, JPG, DOCX.', 'error');
                return;
            }

            const defaultOrigin = window.location.origin.includes('8000')
                ? window.location.origin
                : 'http://127.0.0.1:8000';

            const baseUrl = apiUrlInput.value = defaultOrigin;
            const endpoint = `${baseUrl}/upload_cv`;
            console.log("Gửi request tới:", endpoint);

            const formData = new FormData();
            formData.append('file', file);

            setResult('Đang tải lên...', 'info');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type') || '';
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `HTTP ${response.status}`);
                }

                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    const preview = data.text ? `\n\nXem trước nội dung (tối đa 500 ký tự):\n${data.text}` : '';
                    setResult((data.message || 'Tải lên thành công.') + preview, 'success');
                } else {
                    const text = await response.text();
                    setResult(text || 'Tải lên thành công.', 'success');
                }
            } catch (err) {
                setResult(`Lỗi: ${err.message || err}`, 'error');
                console.error(err);
            }
        });
    })();
    </script>
</body>
</html>
