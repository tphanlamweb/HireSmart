<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Smart Recruitment</title>
    <link rel="stylesheet" href="../Styles/login.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Left Section - Login Form -->
        <div class="login-form-section">
            <div class="logo-section">
                <div class="logo">
                    <img src="../templates/logo-2.png" alt="Smart Recruitment Logo" class="logo-icon">
                </div>
            </div>

            <div class="form-content">
                <h2 class="signin-title">HR Login</h2>
                
                <div class="register-prompt">
                    <p>Đăng nhập để truy cập Dashboard HR</p>
                    <p>User thường có thể xem <a href="Home.html" class="register-link">Jobs tại đây</a></p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <img src="../templates/mail.png" alt="Email" class="input-icon">
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <img src="../templates/password.png" alt="Password" class="input-icon">
                            <input type="password" id="password" placeholder="Enter your Password" required>
                            <i class="fas fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Rememeber me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Đăng nhập HR</button>

                    <div class="social-login">
                        <p class="or-text">or continue with</p>
                        <button type="button" class="google-btn">
                            <img src="../templates/logo_Google.png" alt="Google" class="google-icon">
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Section - Illustration -->
        <div class="illustration-section">
            <div class="illustration">
                <img src="../templates/picture.png" alt="Illustration" class="illustration-img">
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
    
        // =============== LOGIN API ==================
        document.querySelector('.login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
    
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
    
            const res = await fetch("http://localhost:8000/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email, password })
            });
    
            const data = await res.json();
    
            if (res.ok) {
                localStorage.setItem("token", data.token);
                alert("Đăng nhập thành công!");
                window.location.href = "../html/Home.html";
            } else {
                alert(data.detail);
            }
        });
    
        // =============== FORGOT PASSWORD ==================
        document.querySelector('.forgot-password').addEventListener('click', async () => {
            const email = prompt("Nhập email để nhận link reset mật khẩu:");
    
            if (!email) return;
    
            const res = await fetch("http://localhost:8000/forgot-password", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email })
            });
    
            const data = await res.json();
            alert(data.message);
        });
    
        // =============== GOOGLE LOGIN ==================
        document.querySelector('.google-btn').addEventListener('click', () => {
            window.location.href = "http://localhost:8000/login/google";
        });
    </script>
    
</body>
</html>
