<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tải lên CV (PDF)</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <h1>Tải lên CV (PDF)</h1>

        <div class="api-config">
            <label for="apiUrl">API URL:</label>
            <input id="apiUrl" type="text" />
            <span class="hint">Mặc định là FastAPI local</span>
        </div>

        <form id="uploadForm">
            <div class="field">
                <label for="fileInput">Chọn file PDF:</label>
                <input id="fileInput" type="file" accept="application/pdf,.pdf" required />
            </div>
            <button type="submit">Tải lên</button>
        </form>

        <div id="result" class="result" aria-live="polite"></div>
    </div>

    <script>
    (function () {
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const apiUrlInput = document.getElementById('apiUrl');
        const resultEl = document.getElementById('result');

        // Mặc định dùng origin hiện tại nếu truy cập qua http(s)
        try {
            const defaultOrigin = window.location.origin;
            if (defaultOrigin && defaultOrigin.startsWith('http')) {
                apiUrlInput.value = defaultOrigin;
            } else {
                apiUrlInput.value = 'http://127.0.0.1:8000';
            }
        } catch (_) {
            apiUrlInput.value = 'http://127.0.0.1:8000';
        }

        function setResult(message, type = 'info') {
            resultEl.className = `result ${type}`;
            resultEl.textContent = message;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const file = fileInput.files && fileInput.files[0];
            if (!file) {
                setResult('Vui lòng chọn một file PDF.', 'error');
                return;
            }
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                setResult('Chỉ chấp nhận file PDF.', 'error');
                return;
            }

            const baseUrl = apiUrlInput.value.replace(/\/$/, '');
            const endpoint = `${baseUrl}/upload_cv`;

            const formData = new FormData();
            formData.append('file', file);

            setResult('Đang tải lên...', 'info');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });
                const contentType = response.headers.get('content-type') || '';
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `HTTP ${response.status}`);
                }

                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    const preview = data.text ? `\n\nXem trước nội dung (tối đa 500 ký tự):\n${data.text}` : '';
                    setResult((data.message || 'Thành công.') + preview, 'success');
                } else {
                    const text = await response.text();
                    setResult(text || 'Tải lên thành công.', 'success');
                }
            } catch (err) {
                setResult(`Lỗi: ${err.message || err}`, 'error');
            }
        });
    })();
    </script>
</body>
</html>
